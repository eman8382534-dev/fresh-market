    <form>
        <div class="Sign-up">
            <a href="Sign-in.html" class=cla >Do You Have An Account ?</a><br><br><br><br>

            <!-- FIsrtName Input-->

            <label for="Fname">First Name: </label><br>
            <input type="text" name="Fname" value="" placeholder="Write Your First Name" required><br><br>
            <!-- LastName Input-->
            <label for="Lname">Last Name: </label><br>
            <input type="text" name="Lname" value="" placeholder="Write Your Last Name" required><br><br>
            <!-- Phone Number Input-->
            <label for="PhoneNum">Phone Number: </label><br>
            <input type="number" name="PhoneNum" value="" placeholder="Write Your Phone Number" required><br><br>
            <!-- Country Input-->
            <label for="Country">Country: </label><br>
            <input type="text" name="Country" value="" placeholder="Write Your Country" required><br><br>
            <!-- Email Input-->
            <label for="email">E-mail: </label><br>
            <input type="email" name="email" value="" placeholder="example@com" required><br><br>
            <!-- Pass Input-->
            <label for="Password">Password: </label><br>
            <input type="password" name="Password" value="" placeholder="Must Contain Uppercase, Lowercase and Numbers" required><br><br>
            <!-- Repeat Pass Input-->
            <label for="Password">Repeat Password: </label><br>
            <input type="password" name="Password" value="" required><br><br><br>

            <input class=ss type="checkbox" name="remember me" value="" checked>Remember Password ? </label><br><br><br><br>
            <!-- Submit Input-->
            <input class=er  type="submit" value="Sign-Up">
            <!-- Resert Input-->
            <input class=er type="reset" value="Clear">

    </form>
